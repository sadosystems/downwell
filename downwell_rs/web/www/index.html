<!DOCTYPE html>
<!-- downwell_rs wgpu browser frontend. Run web/build.sh, serve this
     directory, and open it in a WebGPU or WebGL2-capable browser. -->
<meta charset="utf-8">
<title>downwell_rs</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; }
  canvas { image-rendering: pixelated; }
</style>
<canvas id="c"></canvas>
<script type="module">
import init, { create_game } from "./web.js";
await init();
const canvas = document.getElementById("c");
const atlasResponse = await fetch("./atlas.png");
const atlas = await createImageBitmap(await atlasResponse.blob(), {
  premultiplyAlpha: "none",
  colorSpaceConversion: "none",
});
const game = await create_game(canvas, atlas);
atlas.close();

// input bits: 1 = space, 2 = left, 4 = right
const KEYS = { Space: 1, KeyA: 2, ArrowLeft: 2, KeyD: 4, ArrowRight: 4 };
let held = 0;
addEventListener("keydown", e => {
  if (KEYS[e.code]) { held |= KEYS[e.code]; e.preventDefault(); }
});
addEventListener("keyup", e => {
  if (KEYS[e.code]) { held &= ~KEYS[e.code]; e.preventDefault(); }
});

// fixed 60 Hz sim under a free-running rAF (which may be 120+ Hz)
const DT = 1000 / 60;
let last = performance.now(), acc = 0;
function loop(now) {
  acc = Math.min(acc + (now - last), 4 * DT); // cap: no catch-up spiral
  last = now;
  while (acc >= DT) {
    game.frame(held);
    acc -= DT;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
