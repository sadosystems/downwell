[package]
name = "render"
version = "0.1.0"
edition = "2021"

[dependencies]
sim = { path = "../sim" }
wgpu = { version = "22", default-features = false, features = ["wgsl", "webgpu", "webgl"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "ImageBitmap"] }
